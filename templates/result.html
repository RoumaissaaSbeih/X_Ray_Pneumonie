<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Résultat d'analyse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg app-navbar">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}"><i class="bi bi-lungs-fill"></i> X-Ray AI</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('index') }}">Analyse</a>
            <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
        </div>
    </div>
</nav>

<main class="workspace-section">
    <div class="container">
        <div class="result-layout">
            <section class="xray-viewer">
                <img src="{{ analysis.image_url }}" alt="Radiographie analysée">
            </section>

            <section class="result-card {{ 'pneumonia' if analysis.result == 'PNEUMONIA' else 'normal' }}">
                <div class="result-icon">
                    <i class="bi {{ 'bi-exclamation-triangle-fill' if analysis.result == 'PNEUMONIA' else 'bi-check-circle-fill' }}"></i>
                </div>
                <span class="eyebrow">Résultat IA</span>
                <h1>{{ analysis.result }}</h1>
                <div class="confidence-ring">
                    <span>{{ analysis.confidence }}%</span>
                    <small>confiance</small>
                </div>
                <dl class="result-meta">
                    <div>
                        <dt>Date</dt>
                        <dd>{{ analysis.date }}</dd>
                    </div>
                    <div>
                        <dt>Image</dt>
                        <dd>{{ analysis.filename }}</dd>
                    </div>
                </dl>
                <div class="d-grid gap-2">
                    <a class="btn btn-primary" href="{{ url_for('report', analysis_id=analysis.id) }}">
                        <i class="bi bi-file-earmark-pdf"></i>
                        Télécharger le rapport PDF
                    </a>
                    <a class="btn btn-outline-primary" href="{{ url_for('index') }}">
                        <i class="bi bi-plus-circle"></i>
                        Nouvelle analyse
                    </a>
                </div>
                <p class="clinical-note">
                    Ce résultat est une aide à la décision et doit être confirmé par un professionnel de santé.
                </p>
            </section>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
